```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pac Man Atari 2600</title>

<style>
*{box-sizing:border-box}
html,body,#game{
margin:0;padding:0;width:100%;height:100%;
overflow:hidden;background:#000
}
#game{
position:fixed;inset:0;width:100vw;height:100dvh;
}
#game canvas{
max-width:100%!important;
max-height:100%!important;
object-fit:contain
}

/* Ocultar FAST y SLOW */
.ejs_fast_forward,.ejs_slow_motion,
#ejs_fast_forward,#ejs_slow_motion,
[title*="Fast Forward"],[title*="Slow Motion"],
[aria-label*="Fast Forward"],[aria-label*="Slow Motion"]{
display:none!important;
}

/* Distribución para teléfono vertical */
@media (orientation:portrait){
#game{height:100dvh}
}

/* Ajuste para teléfono horizontal */
@media (orientation:landscape){
#game{height:100dvh}
}
</style>
</head>

<body>
<div id="game"></div>

<script>
EJS_player="#game";
EJS_core="stella2014";
EJS_gameUrl="./PacMan.a26";
EJS_startOnLoaded=true;
EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";

function ajustarPantalla(){
const g=document.getElementById("game");
g.style.width=window.innerWidth+"px";
g.style.height=window.innerHeight+"px";
}
window.addEventListener("resize",ajustarPantalla);
window.addEventListener("orientationchange",()=>{
setTimeout(ajustarPantalla,300);
setTimeout(ajustarPantalla,1000);
});
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
```
